<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rackhouse sticker pack: carabiner mark, wordmark, mountain icon and a NOT FOR CLIMBING novelty sticker, on vinyl with a peeling corner">
  <defs>
    <linearGradient id="paperbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2ede2"/>
      <stop offset="1" stop-color="#e8e2d3"/>
    </linearGradient>
    <filter id="dshadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#15191c" flood-opacity=".28"/>
    </filter>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="peelShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8d2c2"/>
      <stop offset="100%" stop-color="#c6bfab"/>
    </linearGradient>
  </defs>

  <rect width="800" height="560" rx="20" fill="url(#paperbg)"/>
  <!-- faint craft-paper texture lines -->
  <g stroke="#15191c" stroke-opacity=".03" stroke-width="1">
    <line x1="0" y1="60" x2="800" y2="60"/><line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="420" x2="800" y2="420"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
  </g>

  <!-- circle mark sticker, with a peeling corner -->
  <g filter="url(#dshadow)">
    <g transform="translate(210,190) rotate(-8)">
      <circle cx="0" cy="0" r="88" fill="#ffffff" stroke="#15191c" stroke-width="3.5"/>
      <circle cx="0" cy="6" r="48" fill="none" stroke="#20232a" stroke-width="9"/>
      <line x1="-35" y1="-16" x2="8" y2="-16" stroke="#d85c2a" stroke-width="9" stroke-linecap="round"/>
      <circle cx="-35" cy="-16" r="5" fill="#d85c2a"/>
      <circle cx="8" cy="-16" r="5" fill="#d85c2a"/>
      <circle cx="0" cy="0" r="88" fill="url(#gloss)"/>
    </g>
  </g>
  <!-- peeled corner: the backing paper triangle lifting off the circle sticker -->
  <g transform="translate(210,190) rotate(-8)">
    <path d="M60 -62 Q84 -66 90 -48 Q94 -30 78 -18 Z" fill="url(#peelShade)" stroke="#15191c" stroke-width="2" stroke-opacity=".5"/>
    <path d="M60 -62 Q84 -66 90 -48" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity=".6"/>
  </g>

  <!-- wordmark rectangle sticker -->
  <g filter="url(#dshadow)">
    <g transform="translate(560,150) rotate(6)">
      <rect x="-140" y="-46" width="280" height="92" rx="14" fill="#20232a" stroke="#15191c" stroke-width="3.5"/>
      <text x="0" y="10" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="30" letter-spacing="4" fill="#f7f4ee">RACKHOUSE</text>
      <rect x="-140" y="-46" width="280" height="92" rx="14" fill="url(#gloss)"/>
    </g>
  </g>

  <!-- mountain icon sticker -->
  <g filter="url(#dshadow)">
    <g transform="translate(230,400) rotate(4)">
      <rect x="-95" y="-70" width="190" height="140" rx="20" fill="#4a90c2" fill-opacity=".22" stroke="#15191c" stroke-width="3.5"/>
      <path d="M-55 30 L-15 -30 L15 5 L35 -20 L60 30 Z" fill="#20232a"/>
      <circle cx="30" cy="-42" r="10" fill="#d85c2a"/>
      <rect x="-95" y="-70" width="190" height="140" rx="20" fill="url(#gloss)"/>
    </g>
  </g>

  <!-- NOT FOR CLIMBING novelty tag sticker -->
  <g filter="url(#dshadow)">
    <g transform="translate(560,395) rotate(-5)">
      <rect x="-135" y="-42" width="270" height="84" rx="42" fill="#d85c2a" stroke="#15191c" stroke-width="3.5"/>
      <text x="0" y="9" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="24" letter-spacing="1.5" fill="#f7f4ee">NOT FOR CLIMBING</text>
      <rect x="-135" y="-42" width="270" height="84" rx="42" fill="url(#gloss)"/>
    </g>
  </g>
</svg>
