<!doctype html><html><head><meta charset="utf-8">
<!-- Product render page (local tooling, not part of the site). Served from
     the repo root: python3 -m http.server, then driven by make_images.py. -->
<script type="importmap">{"imports": {"three": "/js/vendor/three.module.min.js"}}</script>
<style>html,body{margin:0;background:transparent}</style></head><body>
<script type="module">
import * as THREE from '/js/vendor/three.module.min.js';
import { STLLoader } from '/js/vendor/STLLoader.js';
const loader = new STLLoader();
const load = (url) => new Promise((res, rej) => loader.load(url, res, undefined, rej));

// opts: {parts:[{stl, color, roughness, metalness}], elev, azim, zoom, size, h, focus, fit}
window.renderView = async (o) => {
  const W = o.size || 1600, H = o.h || W;
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setSize(W, H);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const box = new THREE.Box3();
  for (const p of o.parts) {
    const geo = await load('/' + p.stl);
    geo.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({ color: new THREE.Color(p.color), roughness: p.roughness ?? 0.62, metalness: p.metalness ?? 0 });
    const mesh = new THREE.Mesh(geo, mat); mesh.castShadow = true; mesh.receiveShadow = true; scene.add(mesh);
    geo.computeBoundingBox();
    if (p.fit !== false) box.union(geo.boundingBox);
  }
  const c = new THREE.Vector3(); box.getCenter(c);
  const R = box.getSize(new THREE.Vector3()).length() / 2;
  const focus = o.focus ? new THREE.Vector3(...o.focus) : c;
  const fov = 22; const cam = new THREE.PerspectiveCamera(fov, W / H, 1, 20000); cam.up.set(0, 0, 1);
  const el = o.elev * Math.PI / 180, az = o.azim * Math.PI / 180;
  const d = (R / Math.sin(fov * Math.PI / 360)) * (o.zoom || 1);
  cam.position.set(focus.x + d * Math.cos(el) * Math.cos(az), focus.y + d * Math.cos(el) * Math.sin(az), focus.z + d * Math.sin(el));
  cam.lookAt(focus);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x6b6258, 1.15));
  const key = new THREE.DirectionalLight(0xffffff, 2.3);
  const kdir = new THREE.Vector3(Math.cos(az + 0.9) * 0.8, Math.sin(az + 0.9) * 0.8, 1.1).normalize();
  key.position.copy(c).addScaledVector(kdir, R * 4); key.target.position.copy(c); scene.add(key, key.target);
  key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 4; key.shadow.bias = -0.0004; key.shadow.normalBias = 0.4;
  const sc = key.shadow.camera; sc.left = -R * 1.3; sc.right = R * 1.3; sc.top = R * 1.3; sc.bottom = -R * 1.3; sc.near = R; sc.far = R * 8;
  const fill = new THREE.DirectionalLight(0xfff1e6, 0.75);
  fill.position.copy(c).add(new THREE.Vector3(Math.cos(az - 1.2), Math.sin(az - 1.2), 0.3).multiplyScalar(R * 4)); scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffffff, 0.9);
  rim.position.copy(c).add(new THREE.Vector3(-Math.cos(az), -Math.sin(az), 0.8).multiplyScalar(R * 4)); scene.add(rim);
  renderer.render(scene, cam);
  const url = renderer.domElement.toDataURL('image/png');
  renderer.dispose(); renderer.domElement.remove();
  return url;
};
window.ready = true;
</script></body></html>
